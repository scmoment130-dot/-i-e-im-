<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sana Bir Çiçek 🌸</title>
<style>
*{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;overflow:hidden;
background:radial-gradient(circle at 50% 35%,#39234f,#17152f 65%,#101326);font-family:system-ui,sans-serif;color:#fff}
.scene{text-align:center;padding:24px;width:100%;position:relative}
h1{font-size:clamp(25px,6vw,38px);font-weight:600;margin:0 0 8px;color:#ffe6f3}
p{margin:0;color:#e8d8f2}
.flower{height:360px;width:280px;margin:12px auto 0;position:relative}
.stem{position:absolute;width:7px;height:0;background:linear-gradient(#75d88a,#27845c);left:137px;top:170px;border-radius:10px;transform:rotate(3deg);transform-origin:top;animation:grow 1.5s .3s forwards}
.leaf{position:absolute;width:65px;height:30px;background:linear-gradient(135deg,#8de69b,#25865e);border-radius:100% 0 100% 0;opacity:0;top:265px;left:140px;transform:rotate(-25deg);animation:leaf .8s 1.6s forwards}
.leaf.two{top:300px;left:83px;transform:scaleX(-1) rotate(-25deg);animation-delay:1.9s}
.bloom{position:absolute;left:140px;top:120px;width:0;height:0;animation:sway 4s 2s ease-in-out infinite}
.petal{position:absolute;width:55px;height:85px;left:-27px;top:-80px;border-radius:55% 55% 45% 45%;transform-origin:50% 80%;background:linear-gradient(160deg,#fff0fa,#ff83bb 65%,#df438e);opacity:0;animation:open .9s forwards}
.petal:nth-child(1){transform:rotate(0deg) translateY(-17px);animation-delay:1.2s}
.petal:nth-child(2){transform:rotate(45deg) translateY(-17px);animation-delay:1.3s}
.petal:nth-child(3){transform:rotate(90deg) translateY(-17px);animation-delay:1.4s}
.petal:nth-child(4){transform:rotate(135deg) translateY(-17px);animation-delay:1.5s}
.petal:nth-child(5){transform:rotate(180deg) translateY(-17px);animation-delay:1.6s}
.petal:nth-child(6){transform:rotate(225deg) translateY(-17px);animation-delay:1.7s}
.petal:nth-child(7){transform:rotate(270deg) translateY(-17px);animation-delay:1.8s}
.petal:nth-child(8){transform:rotate(315deg) translateY(-17px);animation-delay:1.9s}
.center{position:absolute;width:39px;height:39px;border-radius:50%;left:-19px;top:-19px;background:radial-gradient(circle,#fff2a6,#ffbd45 60%,#e98b2c);box-shadow:0 0 24px #ffc65d;opacity:0;animation:show .5s 2s forwards}
.spark{position:absolute;color:#ffe6a3;font-size:20px;animation:twinkle 2s infinite}
.s1{left:35px;top:95px}.s2{right:30px;top:145px;animation-delay:.7s}.s3{left:58px;top:245px;animation-delay:1.2s}
.message{margin-top:-4px;font-size:18px;line-height:1.6;color:#ffe2f0;opacity:0;animation:show 1s 2.4s forwards}
@keyframes grow{to{height:190px}} @keyframes leaf{to{opacity:1}}
@keyframes open{to{opacity:1}} @keyframes show{to{opacity:1}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.25)}}
</style>
</head>
<body>
<main class="scene">
<h1>Senin için…</h1>
<p>küçük bir güzellik 🌷</p>
<div class="flower" aria-label="Açan pembe çiçek">
<div class="stem"></div><div class="leaf"></div><div class="leaf two"></div>
<div class="bloom">
<div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div>
<div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div>
<div class="center"></div>
</div>
<span class="spark s1">✦</span><span class="spark s2">✧</span><span class="spark s3">✦</span>
</div>
<div class="message">Günün, bu çiçek gibi güzelliklerle açılsın. 🌸</div>
</main>
</body>
</html>
